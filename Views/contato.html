<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Leonardo Benetti</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<!-- Barra de navegação -->
    <nav class="nav">
        <div class="textonav">
            <h1>Leonardo Benetti</h1>
        </div>

        <div class="links">
            <a href="../Views/index.html">Início</a>
            <a href="../Views/formacao.html">Formação</a>
            <a href="../Views/portfolio.html">Portfólio</a>
            <a class="atual" href="../Views/contato.html">Contato</a>
        </div>
    </nav>
<!-- Conteúdo principal -->
    <main>
        <section class="section1">
            <div class="main_a contato">

                <div class="contato-info">
                    <h1 class="titulo">
                        <span class="corSpan">Entre</span> em Contato
                    </h1>

                    <p class="txtcorpo">
                        Tem alguma dúvida, sugestão ou gostaria de entrar em contato?
                        Preencha o formulário ao lado.
                    </p>
                </div>

                <form id="formContato" class="formulario">

                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail">
                    </div>

                    <div class="campo">
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" rows="6"
                            placeholder="Digite sua mensagem"></textarea>
                    </div>

                    <button type="submit" class="botaoEnviar">
                        Enviar mensagem
                    </button>

                    <p id="mensagemForm"></p>

                </form>

            </div>
        </section>
    </main>

<!-- Rodapé -->
    <footer>
        <p>Todos os Direitos Reservados - Leonardo Benetti Canossa</p>
    </footer>

    <script src="../js/script.js"></script>

</body>

</html>
